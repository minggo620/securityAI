ex/skills/security-audit/ATTACK-CLASSES.md:49)"],["Cryptography and secrets","密码学与秘密信息缺陷","- Weak randomness for security-critical values (tokens, keys, nonces)","检查令牌、密钥、随机数等安全关键值是否使用弱随机性。","[ATTACK-CLASSES.md:56](/Users/daitongmin/.codex/skills/security-audit/ATTACK-CLASSES.md:56)"],["Business logic","业务逻辑缺陷","Hunt logic errors by hand: standard scanners cannot find them, and they yield high-impact findings.","原文强调深入分析业务逻辑错误，并关注其可能造成的高影响。","[ATTACK-CLASSES.md:64](/Users/daitongmin/.codex/skills/security-audit/ATTACK-CLASSES.md:64)"],["Feature abuse and data leakage","功能滥用与数据泄露","Legitimate features used for unintended purposes.","检查正常功能是否被用于产品未预期的用途。","[ATTACK-CLASSES.md:74](/Users/daitongmin/.codex/skills/security-audit/ATTACK-CLASSES.md:74)"],["Chained vulnerabilities and trust boundaries","漏洞组合与信任边界缺陷","Individually allowed or contained behavior can become a vulnerability when another component or lifecycle step relies on a stronger guarantee:","某行为单独看被允许或已受限，但其他组件或生命周期步骤若依赖更强保证，组合后仍可能产生漏洞。","[ATTACK-CLASSES.md:83](/Users/daitongmin/.codex/skills/security-audit/ATTACK-CLASSES.md:83)"],["Wildcard","未预设类别的探索","You are not given a category.","不指定固定攻击类别，探索常规分类之外的漏洞线索。","[ATTACK-CLASSES.md:92](/Users/daitongmin/.codex/skills/security-audit/ATTACK-CLASSES.md:92)"],["Obvious things","显而易见的基础安全问题","Other agents hunt subtle bugs.","与调查细微缺陷的其他任务分工，关注容易被默认已检查而遗漏的基础问题。","[ATTACK-CLASSES.md:111](/Users/daitongmin/.codex/skills/security-audit/ATTACK-CLASSES.md:111)"]]},{"id":"t44","section":"B.2 MEMORY-SAFETY-AND-BINARY.md","line":855,"header":["公共提示块","原文位置"],"rows":[["`MEMORY-SAFETY-AND-BINARY.md#Core discipline`","[MEMORY-SAFETY-AND-BINARY.md:9](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:9)"],["`MEMORY-SAFETY-AND-BINARY.md#Universal moves`","[MEMORY-SAFETY-AND-BINARY.md:89](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:89)"],["`MEMORY-SAFETY-AND-BINARY.md#Validation rules`","[MEMORY-SAFETY-AND-BINARY.md:95](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:95)"]]},{"id":"t45","section":"B.2 MEMORY-SAFETY-AND-BINARY.md","line":861,"header":["类别原名","类别中文说明","原文意图片段","意图片段中文说明","原文位置"],"rows":[["Out-of-bounds read or write","越界读写","A length, offset, index, or terminator reaches a fixed or allocated buffer without a correct bound.","长度、偏移、索引或终止符在缺少正确边界约束时被用于固定或动态分配的缓冲区。","[MEMORY-SAFETY-AND-BINARY.md:21](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:21)"],["Integer overflow, underflow, truncation, and signedness","整数溢出、下溢、截断与符号性问题","Review attacker-controlled arithmetic before allocation, copy, loop, indexing, and pointer operations.","检查内存分配、复制、循环、索引和指针操作之前由攻击者影响的算术运算。","[MEMORY-SAFETY-AND-BINARY.md:24](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:24)"],["Unit and pointer-depth confusion","计量单位与指针层级混淆","Code mixes bytes, elements, code units, pages, words, wire units, or nested pointer element sizes.","检查代码是否混用字节、元素、编码单元、页、字、协议单位或不同指针层级的元素大小。","[MEMORY-SAFETY-AND-BINARY.md:27](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:27)"],["Uninitialized or partially initialized data","未初始化或部分初始化数据","A buffer, padding, struct field, or vector capacity is returned, compared, hashed, serialized, or passed across a trust boundary before initialization.","数据在初始化之前被返回、比较、哈希、序列化或传过信任边界。","[MEMORY-SAFETY-AND-BINARY.md:30](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:30)"],["Use-after-free, stale view, and double free","释放后使用、失效视图与重复释放","Owners are released while callbacks, wait queues, timers, iterators, borrowed slices, or cached raw pointers can still use them.","所有者已释放对象，但回调、队列、定时器、迭代器、借用切片或缓存指针仍可能使用它。","[MEMORY-SAFETY-AND-BINARY.md:35](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:35)"],["Type confusion and invalid downcast","类型混淆与无效向下转型","A tag, vtable, union discriminator, object kind, or foreign handle is checked differently from the representation later read.","检查标签、虚表、联合体判别值、对象种类或外部句柄的验证是否与后来读取的表示一致。","[MEMORY-SAFETY-AND-BINARY.md:38](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:38)"],["Reference-count and ownership races","引用计数与所有权竞态","Non-atomic retain/release, a check followed by an unlocked use, or inconsistent ownership across threads can free or mutate an object during access.","非原子引用操作、未加锁使用或线程间所有权不一致可能导致访问中的对象被释放或修改。","[MEMORY-SAFETY-AND-BINARY.md:41](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:41)"],["Shared-state races and TOCTOU","共享状态竞态与检查使用时差（TOCTOU）","Concurrent parser streams, global caches, lazy initialization, signal handlers, and resource teardown can invalidate bounds, policy, or pointers established earlier.","并发解析、全局缓存、延迟初始化、信号处理或资源销毁可能使先前确认的边界、策略或指针失效。","[MEMORY-SAFETY-AND-BINARY.md:44](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:44)"],["Lock-order, deadlock, and starvation","锁顺序、死锁与饥饿","Externally reachable operations acquire locks in inconsistent order or hold them across callbacks and blocking I/O.","检查外部可达操作是否以不一致顺序获取锁，或在回调及阻塞 I/O 期间持锁。","[MEMORY-SAFETY-AND-BINARY.md:47](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:47)"],["Pointer-length and ownership contract mismatch","指针长度与所有权契约不一致","Caller and callee disagree on who allocates, frees, pins, or mutates a buffer, how long a pointer remains valid, or whether a length is bytes or elements.","调用双方对分配、释放、固定、修改、指针有效期或长度单位存在分歧。","[MEMORY-SAFETY-AND-BINARY.md:52](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:52)"],["Layout, alignment, and enum disagreement","布局、对齐与枚举解释不一致","Foreign code receives a struct, bitfield, packed record, callback signature, integer width, enum, or calling convention that differs by architecture or build flag.","外部代码接收的数据布局、位域、打包、签名、位宽、枚举或调用约定可能随架构和构建选项不同。","[MEMORY-SAFETY-AND-BINARY.md:55](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:55)"],["Unwind, exception, and thread-affinity violations","栈展开、异常与线程亲和性违规","Exceptions or panics cross an ABI that forbids unwinding, callbacks run after teardown, or APIs requiring one runtime thread are invoked elsewhere.","检查异常越过禁止展开的 ABI、销毁后的回调，以及必须在特定运行时线程执行的操作。","[MEMORY-SAFETY-AND-BINARY.md:58](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:58)"],["Library, plugin, and executable search-order trust","库、插件与可执行文件搜索顺序的信任问题","A privileged process loads a library, plugin, runtime image, or helper from a path writable by a less-trusted principal, or resolves a bare name through an attacker-influenceable working directory or environment.","特权进程可能从低信任主体可写的位置加载代码，或通过攻击者影响的目录和环境解析文件名。","[MEMORY-SAFETY-AND-BINARY.md:63](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:63)"],["Missing artifact identity or signature binding","缺少产物身份或签名绑定","A loader verifies one file or metadata record but maps a different image because path resolution, file replacement, architecture slices, or embedded resources are not bound to the check.","验证的文件或元数据与实际映射的镜像可能因路径、替换、架构切片或资源未绑定而不同。","[MEMORY-SAFETY-AND-BINARY.md:66](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:66)"],["Malformed binary metadata and relocation handling","畸形二进制元数据与重定位处理缺陷","Offsets, counts, sections, relocations, symbols, bytecode, or debug metadata are trusted before range, overlap, and representation checks.","偏移、数量、段、重定位、符号或字节码在范围、重叠和表示检查之前被信任。","[MEMORY-SAFETY-AND-BINARY.md:69](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:69)"],["JIT and generated-code consistency","JIT 与生成代码一致性缺陷","Validator, interpreter, optimizer, and generated code disagree about types, bounds, side effects, or lifetime.","验证器、解释器、优化器和生成代码对类型、边界、副作用或生命周期的解释可能不同。","[MEMORY-SAFETY-AND-BINARY.md:72](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:72)"],["Unload, reload, and teardown safety","卸载、重载与销毁安全缺陷","Live function pointers, callbacks, worker threads, or data views survive module unload or runtime reset.","模块卸载或运行时重置后，函数指针、回调、线程或数据视图仍存活并可能被使用。","[MEMORY-SAFETY-AND-BINARY.md:75](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:75)"],["User-copy bounds and repeated reads","用户内存复制边界与重复读取缺陷","A syscall, ioctl, driver, or kernel parser derives a trusted fact from user memory then reads the same mutable address again.","内核接口先从用户内存建立可信判断，之后又读取同一可变地址，可能使用已变化的数据。","[MEMORY-SAFETY-AND-BINARY.md:80](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:80)"],["Privileged object lifecycle and dispatch consistency","特权对象生命周期与分派一致性缺陷","Externally reachable objects have unbalanced retain/release, teardown without observer drain, unchecked selector/table indices, or duplicated compatibility paths that omit a guard.","外部可达对象可能存在引用失衡、销毁未清理观察者、分派索引未检查或兼容路径漏防护。","[MEMORY-SAFETY-AND-BINARY.md:83](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:83)"],["Under-authorized powerful interfaces","授权不足的高权限接口","A device node, admin socket, helper, or management API validates shape but not the caller's authority over the resource.","接口只校验输入形状，没有校验调用者对目标资源的权限。","[MEMORY-SAFETY-AND-BINARY.md:86](/Users/daitongmin/.codex/skills/security-audit/MEMORY-SAFETY-AND-BINARY.md:86)"]]},{"id":"t46","section":"B.3 AI-AND-LLM.md","line":886,"header":["公共提示块","原文位置"],"rows":[["`AI-AND-LLM.md#Core discipline`","[AI-AND-LLM.md:9](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:9)"],["`AI-AND-LLM.md#Universal moves`","[AI-AND-LLM.md:70](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:70)"],["`AI-AND-LLM.md#Validation rules`","[AI-AND-LLM.md:76](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:76)"]]},{"id":"t47","section":"B.3 AI-AND-LLM.md","line":892,"header":["类别原名","类别中文说明","原文意图片段","意图片段中文说明","原文位置"],"rows":[["Indirect injection through retrieved or ingested content","检索或摄取内容引发的间接注入","An attacker can write a RAG document, indexed page, file, email, issue body, tool response, or metadata that enters a different principal's model context.","攻击者可写的文档、页面、文件、邮件、工单、工具响应或元数据进入另一主体的模型上下文。","[AI-AND-LLM.md:22](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:22)"],["Cross-session or cross-tenant context bleed","跨会话或跨租户上下文泄漏","Conversation history, embeddings, retrieval results, or prompt caches are keyed too broadly.","历史对话、向量、检索结果或提示缓存的键范围过宽，可能混入不同会话或租户的信息。","[AI-AND-LLM.md:25](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:25)"],["Persistent memory poisoning","持久记忆投毒","Attacker-controlled content or model summaries are written into memory that later shapes another task, user, or privileged session.","攻击者内容或模型摘要被写入持久记忆，随后影响其他任务、用户或特权会话。","[AI-AND-LLM.md:28](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:28)"],["Prompt role and provenance confusion","提示角色与来源混淆","Prompt assembly lets untrusted text impersonate a system message, prior turn, tool result, policy, or memory record.","不可信文本在提示组装时能够伪装成系统消息、历史回合、工具结果、策略或记忆记录。","[AI-AND-LLM.md:31](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:31)"],["Tool-argument injection into a downstream sink","工具参数向下游危险操作点注入","Model-produced arguments reach SQL, shell, file, URL-fetch, or privileged APIs without handler-side validation.","模型生成参数未经处理器侧校验，进入 SQL、shell、文件、URL 获取或特权 API。","[AI-AND-LLM.md:36](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:36)"],["Excessive agency and confused-deputy authority","过度自主能力与混淆代理权限","The agent uses a service identity or broad credential, while the tool handler does not re-check the requesting principal's permission on the named resource.","Agent 使用服务身份或宽权限凭据，但工具处理器未重新检查请求主体对指定资源的权限。","[AI-AND-LLM.md:39](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:39)"],["Action-confirmation and approval binding","动作确认与批准绑定缺陷","A user approves one described action but execution can use changed arguments, a different resource, a different principal, or a later model turn.","用户批准的动作与真正执行的参数、资源、主体或后续模型回合不一致。","[AI-AND-LLM.md:42](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:42)"],["Tool-schema and dispatcher disagreement","工具 schema 与分派器解释不一致","The schema accepts aliases, extra fields, duplicate keys, coercions, nested free-form objects, or out-of-range values that the dispatcher or handler interprets differently.","schema 接受的别名、额外字段、重复键、类型转换、自由对象或越界值被执行端不同解释。","[AI-AND-LLM.md:45](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:45)"],["Unbounded delegated action loops","无界委派动作循环","A bounded request can enqueue repeated spend, send, mutation, or external API work without a per-request budget, per-action authorization, cancellation, or idempotency control.","有限请求可能触发重复支出、发送、修改或 API 工作，却缺少预算、逐动作授权、取消或幂等控制。","[AI-AND-LLM.md:48](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:48)"],["Sub-agent and MCP trust inheritance","子 Agent 与 MCP 信任继承过度","A delegated task receives the full session, credentials, memory, or capabilities rather than the least authority required.","委派任务继承整个会话、凭据、记忆或能力，而不是完成任务所需的最小权限。","[AI-AND-LLM.md:53](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:53)"],["MCP server and tool identity confusion","MCP 服务端与工具身份混淆","Calls or results are routed by attacker-influenceable server names, tool names, request IDs, resource URIs, or model-selected aliases rather than the authenticated connection and outstanding request.","调用或结果按攻击者可影响的名称、ID、URI 或别名路由，而非绑定已认证连接与待处理请求。","[AI-AND-LLM.md:56](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:56)"],["MCP metadata and schema as policy","把 MCP 元数据与 schema 当作策略","Tool descriptions, resource metadata, prompts, completion hints, or schemas supplied by an MCP peer are trusted as policy or authorization.","将 MCP 对端提供的描述、元数据、提示或 schema 误当作安全策略或授权依据。","[AI-AND-LLM.md:59](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:59)"],["Insecure output rendering","不安全的模型输出渲染","Model output reaches an executing HTML, Markdown, template, URL, or command sink without the sink's required encoding and policy.","模型输出未经目标操作点要求的编码与策略检查，进入 HTML、Markdown、模板、URL 或命令。","[AI-AND-LLM.md:64](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:64)"],["Sensitive context extraction","敏感上下文提取","The assembled context contains credentials, another user's data, private source, or policy values that themselves grant access, and user-influenced output exposes them.","上下文包含凭据、其他用户数据、私有源码或授予权限的策略值，受用户影响的输出将其暴露。","[AI-AND-LLM.md:67](/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md:67)"]]},{"id":"t48","section":"B.4 WEB-PROTOCOL-AND-AUTH.md","line":911,"header":["公共提示块","原文位置"],"rows":[["`WEB-PROTOCOL-AND-AUTH.md#Core discipline`","[WEB-PROTOCOL-AND-AUTH.md:9](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:9)"],["`WEB-PROTOCOL-AND-AUTH.md#Universal moves`","[WEB-PROTOCOL-AND-AUTH.md:91](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:91)"],["`WEB-PROTOCOL-AND-AUTH.md#Validation rules`","[WEB-PROTOCOL-AND-AUTH.md:98](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:98)"]]},{"id":"t49","section":"B.4 WEB-PROTOCOL-AND-AUTH.md","line":917,"header":["类别原名","类别中文说明","原文意图片段","意图片段中文说明","原文位置"],"rows":[["Request framing and desynchronization","请求边界解析与连接不同步","Front end and back end disagree on request length or header normalization.","前端和后端对请求长度或请求头规范化的解释不一致。","[WEB-PROTOCOL-AND-AUTH.md:21](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:21)"],["Web cache poisoning through unkeyed input","未纳入缓存键的输入导致缓存投毒","A request value changes cached content or security-relevant headers but is absent from the cache key.","请求值改变缓存内容或安全相关响应头，却未包含在缓存键中。","[WEB-PROTOCOL-AND-AUTH.md:24](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:24)"],["Cache deception and private-response caching","缓存欺骗与私有响应缓存","Cache routing treats a private dynamic path as a public static asset, or caches a response whose identity and authorization inputs are missing from policy.","缓存将私有动态路径误当作公共静态资源，或缓存策略漏掉身份和授权输入。","[WEB-PROTOCOL-AND-AUTH.md:27](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:27)"],["Host and forwarded-header trust","Host 与转发请求头信任缺陷","Untrusted host/proxy metadata determines absolute URLs, tenant routing, callbacks, reset links, cache keys, or the client address used by authorization.","不可信主机或代理元数据影响绝对 URL、租户路由、回调、重置链接、缓存键或授权使用的客户端地址。","[WEB-PROTOCOL-AND-AUTH.md:30](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:30)"],["Response-header injection","响应头注入","Untrusted data reaches `Location`, `Set-Cookie`, CSP, or another response header with unsafe control characters or normalization.","不可信数据通过不安全控制字符或规范化进入 Location、Set-Cookie、CSP 等响应头。","[WEB-PROTOCOL-AND-AUTH.md:33](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:33)"],["Ordinary CSRF","常规跨站请求伪造（CSRF）","A browser sends ambient credentials to a state-changing endpoint that accepts a cross-site request without an effective anti-CSRF token, same-site request binding, or strict Origin/Referer validation.","浏览器自动附带凭据的跨站修改请求被接受，且缺少有效 CSRF 令牌、同站绑定或严格来源检查。","[WEB-PROTOCOL-AND-AUTH.md:38](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:38)"],["Session fixation and invalidation","会话固定与失效处理缺陷","Session identifiers are not rotated on login, account switch, MFA completion, impersonation, or other privilege changes, or remain valid after logout, password change, revocation, and account disable.","权限变化时不轮换会话标识，或退出、改密、撤销、禁用后会话仍有效。","[WEB-PROTOCOL-AND-AUTH.md:41](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:41)"],["Cookie scope and transport","Cookie 范围与传输缺陷","A sensitive cookie has an over-broad `Domain` or `Path`, can cross an insecure transport, or conflicts with a sibling cookie that another component selects differently.","敏感 Cookie 的 Domain/Path 过宽、跨不安全传输，或与其他组件选择的同类 Cookie 冲突。","[WEB-PROTOCOL-AND-AUTH.md:44](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:44)"],["JWT verification and claim binding","JWT 验证与声明绑定缺陷","Check signature verification, server-pinned algorithm and key source, then `exp`, `nbf`, `aud`, and `iss`.","检查签名、服务端固定算法和密钥来源，以及 exp、nbf、aud、iss 等时间和身份声明。","[WEB-PROTOCOL-AND-AUTH.md:51](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:51)"],["OAuth/OIDC request and callback binding","OAuth/OIDC 请求与回调绑定缺陷","Validate exact `redirect_uri` ownership where the target is the authorization server; session-bound `state`; PKCE and authorization-code binding where applicable; ID-token issuer/audience/signature/nonce; and selected-Id…","按组件角色检查回调地址归属、会话 state、PKCE、授权码，以及 ID token 的签发者、受众、签名和 nonce 绑定。","[WEB-PROTOCOL-AND-AUTH.md:54](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:54)"],["SAML signed-object and assertion binding","SAML 签名对象与身份断言绑定缺陷","Ensure the element whose signature is validated is the element used as identity.","被验证签名的 XML 元素必须就是实际用作身份依据的元素。","[WEB-PROTOCOL-AND-AUTH.md:57](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:57)"],["MFA enrollment and assurance downgrade","MFA 注册与认证保障等级降级","Enrollment, replacement, disablement, recovery-code generation, trusted-device creation, and fallback login require the intended prior assurance.","注册、替换、禁用、生成恢复码、添加可信设备或回退登录必须满足所要求的先前认证强度。","[WEB-PROTOCOL-AND-AUTH.md:62](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:62)"],["Step-up binding and bypass","增强认证绑定与绕过","A successful challenge upgrades the wrong session, account, tenant, action, or API request, or an alternate route omits the assurance check.","成功挑战可能升级错误的会话、账户、租户、动作或 API 请求，或替代路径遗漏保障等级检查。","[WEB-PROTOCOL-AND-AUTH.md:65](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:65)"],["WebAuthn and passkey verification","WebAuthn 与通行密钥验证缺陷","At registration, bind challenge, RP ID, expected origin, credential, user/userHandle, algorithm, and policy-required user verification to the initiating session.","注册时将挑战、RP ID、预期来源、凭据、用户、算法及所需用户验证绑定到发起会话。","[WEB-PROTOCOL-AND-AUTH.md:68](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:68)"],["Account linking and identity collision","账户关联与身份碰撞","Adding an IdP, passkey, email, phone, device, or external account to an existing account must require a current authenticated session, verified ownership of the new identity, policy-required step-up, and callback state b…","给已有账户添加外部身份或凭据时，必须验证当前会话、新身份归属、所需增强认证和回调状态绑定。","[WEB-PROTOCOL-AND-AUTH.md:71](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:71)"],["Password reset and broader recovery","密码重置与其他账户恢复缺陷","Recovery tokens, support/admin recovery, backup codes, device migration, and email or phone change often become the weakest authentication path.","恢复令牌、管理员恢复、备份码、设备迁移或联系方式变更可能成为最弱认证路径。","[WEB-PROTOCOL-AND-AUTH.md:74](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:74)"],["API-key scope and resource binding","API 密钥范围与资源绑定缺陷","A key authenticates to broader tenants, resources, actions, or environments than its server-side record grants, or request parameters override those bindings.","密钥访问范围超过服务端记录授予的租户、资源、动作或环境，或请求参数覆盖这些绑定。","[WEB-PROTOCOL-AND-AUTH.md:79](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:79)"],["API-key exposure and unsafe transport","API 密钥暴露与不安全传输","Keys appear in client bundles, URLs, redirects, logs, error paths, build artifacts, or responses accessible to a lower-trust principal.","密钥出现在低信任主体可见的客户端包、URL、跳转、日志、错误、构建产物或响应中。","[WEB-PROTOCOL-AND-AUTH.md:82](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:82)"],["mTLS peer and application-identity confusion","mTLS 对端与应用身份混淆","A process trusts client-certificate identity headers from any network peer, verifies a chain but maps attacker-influenceable subject text to an account incorrectly, or accepts a certificate for the wrong trust domain, ex…","检查是否信任任意对端的证书身份头、错误映射可控证书主体，或接受不符合目标信任域和用途的证书。","[WEB-PROTOCOL-AND-AUTH.md:85](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:85)"],["Certificate lifecycle fallback","证书生命周期中的不安全回退","Expired, revoked, missing, or renewal-failed certificates cause silent fallback to bearer-only or anonymous operation, or long-lived pooled connections retain authorization after revocation.","证书过期、撤销、缺失或续期失败导致仅 bearer/匿名回退，或长连接在撤销后仍保留权限。","[WEB-PROTOCOL-AND-AUTH.md:88](/Users/daitongmin/.codex/skills/security-audit/WEB-PROTOCOL-AND-AUTH.md:88)"]]},{"id":"t50","section":"B.5 CLIENT-SIDE.md","line":942,"header":["公共提示块","原文位置"],"rows":[["`CLIENT-SIDE.md#Core discipline`","[CLIENT-SIDE.md:9](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:9)"],["`CLIENT-SIDE.md#Universal moves`","[CLIENT-SIDE.md:71](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:71)"],["`CLIENT-SIDE.md#Validation rules`","[CLIENT-SIDE.md:77](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:77)"]]},{"id":"t51","section":"B.5 CLIENT-SIDE.md","line":948,"header":["类别原名","类别中文说明","原文意图片段","意图片段中文说明","原文位置"],"rows":[["DOM-based XSS","基于 DOM 的跨站脚本（XSS）","Trace `location` fields, `document.referrer`, `window.name`, message data, storage, and browser-controlled document state into `innerHTML`, `outerHTML`, `document.write`, string-evaluating APIs, executable URLs, jQuery H…","追踪 URL、referrer、window.name、消息、存储及文档状态，检查它们是否进入 HTML 写入、字符串执行或可执行 URL 等操作点。","[CLIENT-SIDE.md:21](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:21)"],["DOM clobbering","DOM 属性覆盖（DOM clobbering）","Attacker-injected `id` or `name` attributes shadow a global, form property, configuration object, or initialization flag later trusted by code.","攻击者注入的 id/name 遮蔽全局变量、表单属性、配置或初始化标记，随后被代码信任。","[CLIENT-SIDE.md:24](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:24)"],["Prototype pollution and gadget chain","原型污染与利用链","An attacker-controlled key reaches a recursive write such as deep merge or path assignment and modifies prototype state.","攻击者控制的键进入深度合并或路径赋值等递归写入，改变对象原型状态。","[CLIENT-SIDE.md:27](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:27)"],["`postMessage` origin and source trust","postMessage 来源与窗口身份信任缺陷","A handler performs a sensitive action with `event.data` without an exact origin allowlist and, where multiple frames share an origin, the expected `event.source`.","处理器在缺少精确 origin 白名单及必要 event.source 检查时，用消息数据执行敏感动作。","[CLIENT-SIDE.md:32](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:32)"],["Cross-site WebSocket request use","跨站 WebSocket 请求利用","A WebSocket upgrade accepts ambient cookies from an untrusted origin without an `Origin` check or channel-specific token, allowing the victim's session to read or mutate data.","来自不可信 origin 的升级请求自动附带 Cookie，被服务端接受后可用受害会话读取或修改数据。","[CLIENT-SIDE.md:35](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:35)"],["Credentialed CORS trust","携带凭据的 CORS 信任缺陷","The server reflects or weakly matches `Origin` while allowing credentials and returns sensitive responses.","服务端允许凭据、反射或弱匹配 Origin，并向不可信来源返回敏感响应。","[CLIENT-SIDE.md:38](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:38)"],["Service-worker registration and scope takeover","Service Worker 注册与作用域接管","Attacker-influenceable content can become the registered worker script, control a path that receives an over-broad `Service-Worker-Allowed` scope, or alter update imports without integrity control.","可受攻击者影响的内容成为 worker 脚本、获得过宽作用域，或未受完整性约束地改变更新导入。","[CLIENT-SIDE.md:43](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:43)"],["Service-worker cache and identity confusion","Service Worker 缓存与身份混淆","The worker caches personalized responses without including account, tenant, authorization state, or request mode in its policy, then serves them after account switch or logout.","个性化响应缓存未绑定账户、租户、授权状态或请求模式，在切换账户或退出后仍被返回。","[CLIENT-SIDE.md:46](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:46)"],["Browser-storage disclosure and stale authorization","浏览器存储泄露与过期授权","Tokens, private responses, draft data, or authorization decisions remain in `localStorage`, `sessionStorage`, IndexedDB, Cache Storage, extension storage, or client state and become readable by another account or less-tr…","凭据、私有响应、草稿或授权结果留在浏览器存储中，之后被不同账户或低信任组件读取。","[CLIENT-SIDE.md:49](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:49)"],["Cross-context storage and broadcast confusion","跨上下文存储与广播混淆","`storage` events, `BroadcastChannel`, shared workers, or origin-wide caches carry identity or commands between tabs without binding them to the current session.","存储事件、广播、共享 worker 或 origin 级缓存未绑定当前会话就在标签页间传递身份和命令。","[CLIENT-SIDE.md:52](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:52)"],["XS-Leaks and cross-origin state oracles","跨站信息泄漏（XS-Leaks）与跨源状态探测","An attacker page can distinguish protected cross-origin state through resource load/error events, frame or window state, redirect behavior, timing, cache state, or response size while the browser attaches victim credenti…","攻击者页面通过加载事件、窗口状态、跳转、时序、缓存或响应大小区分受保护的跨源状态。","[CLIENT-SIDE.md:57](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:57)"],["Window and opener state disclosure","窗口与 opener 状态泄露","A cross-origin window's permitted metadata or navigation result reveals protected state, or a retained opener/named-window relationship lets an attacker-controlled page influence a privileged navigation.","跨源窗口元数据或导航结果泄露受保护状态，保留的 opener/命名窗口关系也可能影响特权导航。","[CLIENT-SIDE.md:60](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:60)"],["Clickjacking","点击劫持","A framed, state-changing action lacks effective `frame-ancestors`, `X-Frame-Options`, or equivalent UI isolation.","可嵌入框架的状态修改操作缺少有效 frame-ancestors、X-Frame-Options 或等效 UI 隔离。","[CLIENT-SIDE.md:65](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:65)"],["Client-side navigation confusion","客户端导航混淆","A client source controls redirect or navigation without scheme and destination policy, including executable `javascript:` or `data:` destinations.","客户端可控来源在缺少协议和目标策略时决定跳转，包括 javascript:、data: 等可执行目标。","[CLIENT-SIDE.md:68](/Users/daitongmin/.codex/skills/security-audit/CLIENT-SIDE.md:68)"]]},{"id":"t52","section":"B.6 SUPPLY-CHAIN-AND-RELEASE.md","line":967,"header":["公共提示块","原文位置"],"rows":[["`SUPPLY-CHAIN-AND-RELEASE.md#Core discipline`","[SUPPLY-CHAIN-AND-RELEASE.md:9](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:9)"],["`SUPPLY-CHAIN-AND-RELEASE.md#Universal moves`","[SUPPLY-CHAIN-AND-RELEASE.md:61](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:61)"],["`SUPPLY-CHAIN-AND-RELEASE.md#Validation rules`","[SUPPLY-CHAIN-AND-RELEASE.md:67](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:67)"]]},{"id":"t53","section":"B.6 SUPPLY-CHAIN-AND-RELEASE.md","line":973,"header":["类别原名","类别中文说明","原文意图片段","意图片段中文说明","原文位置"],"rows":[["Dependency source and namespace confusion","依赖来源与命名空间混淆","Resolver configuration can select an unintended public/private namespace, fallback registry, mirror, repository, or source URL.","解析器配置可能选择非预期的公私命名空间、回退仓库、镜像或源码 URL。","[SUPPLY-CHAIN-AND-RELEASE.md:21](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:21)"],["Mutable and unbound build inputs","可变且未绑定的构建输入","Builds consume branches, tags, unverified submodules, downloaded tools, generated assets, remote includes, floating CI actions, or container tags whose content can change without source review.","构建使用分支、标签、未验证子模块、下载工具、生成资产、远程包含或浮动镜像，其内容可绕过源码审查而变化。","[SUPPLY-CHAIN-AND-RELEASE.md:24](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:24)"],["Generated-source and codegen provenance gaps","生成源码与代码生成来源缺口","Schemas, vendored archives, generated clients, localization, documentation examples, or binary blobs produce executable or shipped content without the same review and integrity gate as source.","schema、归档、生成客户端、本地化、示例或二进制输入形成执行/发布内容，却未经过源码同等的审查和完整性门。","[SUPPLY-CHAIN-AND-RELEASE.md:27](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:27)"],["Build-context inclusion","构建上下文意外包含内容","Secrets, local configuration, repository metadata, test fixtures, or developer artifacts enter a package or image because the build context and ignore rules exceed intended release inputs.","构建范围和忽略规则过宽，使秘密、本地配置、仓库元数据、测试或开发文件进入软件包/镜像。","[SUPPLY-CHAIN-AND-RELEASE.md:30](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:30)"],["Untrusted code in a privileged workflow","特权工作流执行不可信代码","A pull request, issue comment, fork, dependency update, or external event runs contributor-controlled code with protected secrets, write tokens, deployment authority, or a trusted runner.","外部贡献或事件让可控代码获得受保护秘密、写令牌、部署权限或可信 runner。","[SUPPLY-CHAIN-AND-RELEASE.md:35](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:35)"],["Workflow command and expression confusion","工作流命令与表达式混淆","Attacker-controlled branch names, commit messages, issue fields, artifact names, matrix values, or generated output enter shell commands, template expressions, paths, or privileged workflow inputs without canonical valid…","攻击者控制的分支、提交、工单、产物名、矩阵值或生成输出未经规范校验就进入命令、表达式、路径或特权输入。","[SUPPLY-CHAIN-AND-RELEASE.md:38](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:38)"],["Cache, artifact, and workspace trust mixing","缓存、产物与工作区信任混用","A lower-trust job can populate a cache, artifact, shared workspace, or output that a higher-trust job later restores and executes or releases.","低信任任务写入的缓存、产物或共享输出被高信任任务恢复并执行或发布。","[SUPPLY-CHAIN-AND-RELEASE.md:41](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:41)"],["Automation identity overreach","自动化身份权限越界","CI jobs receive permissions beyond the operation, repository, environment, or duration needed, and untrusted job inputs can select the affected resource.","CI 获得超过操作所需范围/时长的权限，不可信输入还能选择被操作资源。","[SUPPLY-CHAIN-AND-RELEASE.md:44](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:44)"],["Build-to-promotion substitution","构建到晋升的产物替换","Tests, review, signature, and publication refer to mutable tags, filenames, channels, or artifact IDs rather than the same immutable digest.","测试、审查、签名和发布绑定可变名称，而未绑定同一个不可变产物摘要。","[SUPPLY-CHAIN-AND-RELEASE.md:49](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:49)"],["Release authorization and signing-policy gaps","发布授权与签名策略缺口","A release or signature is accepted from the wrong workflow, repository, branch, environment, key role, or threshold.","来自错误工作流、仓库、分支、环境、密钥角色或签名门槛的发布/签名被接受。","[SUPPLY-CHAIN-AND-RELEASE.md:52](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:52)"],["Update metadata and rollback confusion","更新元数据与回滚混淆","An updater authenticates payload bytes but not version, product, platform, channel, target path, expiry, or rollback state, or it accepts metadata and payload from different authorized transactions.","更新器只认证内容字节，未绑定版本、产品、平台、渠道、路径、有效期、回滚状态或同一授权事务。","[SUPPLY-CHAIN-AND-RELEASE.md:55](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:55)"],["Plugin and extension trust expansion","插件与扩展信任扩大","An extension package gains host authority beyond its declared scope, a lower-trust publisher can replace another publisher's identity, or install/update hooks run before authenticity and capability checks.","扩展超出声明范围获得宿主权限、低信任发布者替换他人身份，或在认证/能力检查前执行安装更新钩子。","[SUPPLY-CHAIN-AND-RELEASE.md:58](/Users/daitongmin/.codex/skills/security-audit/SUPPLY-CHAIN-AND-RELEASE.md:58)"]]},{"id":"t54","section":"B.7 CLOUD-AND-DEPLOYMENT.md","line":990,"header":["公共提示块","原文位置"],"rows":[["`CLOUD-AND-DEPLOYMENT.md#Core discipline`","[CLOUD-AND-DEPLOYMENT.md:9](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:9)"],["`CLOUD-AND-DEPLOYMENT.md#Universal moves`","[CLOUD-AND-DEPLOYMENT.md:74](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:74)"],["`CLOUD-AND-DEPLOYMENT.md#Validation rules`","[CLOUD-AND-DEPLOYMENT.md:80](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:80)"]]},{"id":"t55","section":"B.7 CLOUD-AND-DEPLOYMENT.md","line":996,"header":["类别原名","类别中文说明","原文意图片段","意图片段中文说明","原文位置"],"rows":[["Workload identity overreach","工作负载身份权限越界","A workload, pod, function, edge worker, or node identity can act on tenants, accounts, resources, or APIs beyond its role, and untrusted request or job input selects that target.","不可信请求或任务输入选择目标，使工作负载身份执行超出其角色的租户、账户、资源或 API 操作。","[CLOUD-AND-DEPLOYMENT.md:21](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:21)"],["Cross-account or cross-tenant role confusion","跨账户或跨租户角色混淆","Role assumption, external IDs, token exchange, workload federation, or resource policies accept identity claims not bound to the intended source account, audience, repository, namespace, or workload.","角色承担、令牌交换或联合身份接受的声明未绑定预期来源账户、受众、仓库、命名空间或工作负载。","[CLOUD-AND-DEPLOYMENT.md:24](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:24)"],["Application authorization delegated to cloud metadata","把应用授权委托给云元数据","An app trusts caller-supplied identity headers, tags, labels, account IDs, or resource metadata without verifying they came from the cloud control plane or a trusted proxy.","应用信任调用者提供的身份头、标签、账户 ID 或资源元数据，却未验证它来自可信控制面/代理。","[CLOUD-AND-DEPLOYMENT.md:27](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:27)"],["Unexpected service or management-plane reachability","非预期服务或管理面可达","An ingress, service, listener, security group, load-balancer annotation, port mapping, or server bind exposes an admin, debug, metrics, node, control-plane, or internal API to a lower-trust network.","ingress、监听、网络规则、负载均衡注解、端口映射等将管理/调试/内部接口暴露给低信任网络。","[CLOUD-AND-DEPLOYMENT.md:32](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:32)"],["Trusted-proxy and mesh identity bypass","可信代理与服务网格身份绕过","A backend accepts forwarded identity, mTLS subject, or authorization metadata from peers outside the intended ingress/sidecar, or an alternate port and health/legacy path bypasses the mesh.","后端接受非预期代理/sidecar 对端的身份元数据，或替代端口和健康/旧路径绕过网格。","[CLOUD-AND-DEPLOYMENT.md:35](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:35)"],["Metadata and internal-service reachability","云元数据与内部服务可达","An untrusted URL, destination, or protocol selection reaches instance/container metadata, control-plane sockets, or internal APIs with workload credentials.","不可信 URL、目的地址或协议选择使带工作负载凭据的操作访问元数据、控制面 socket 或内部 API。","[CLOUD-AND-DEPLOYMENT.md:38](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:38)"],["Host or control-plane capability exposure","宿主或控制面能力暴露","A lower-trust workload can select privileged mode, capabilities, host namespaces, host paths, device mounts, container runtime sockets, or service-account tokens that cross into node/control-plane authority.","低信任工作负载通过特权模式、capabilities、host namespace/path、设备或运行时 socket 跨入宿主/控制面权限。","[CLOUD-AND-DEPLOYMENT.md:43](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:43)"],["Admission and policy path inconsistency","准入与策略路径不一致","One deployment route enforces image identity, namespace, resource, secret, or privilege policy while another controller, job, upgrade, restore, or compatibility path does not.","某部署路径执行镜像、命名空间、资源或权限策略，其他控制器、升级、恢复或兼容路径却遗漏。","[CLOUD-AND-DEPLOYMENT.md:46](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:46)"],["Namespace and label trust confusion","命名空间与标签信任混淆","Network, admission, secret, or workload-identity policy relies on labels, annotations, names, or namespaces that a less-trusted principal can set.","网络、准入、秘密或身份策略依赖低信任主体可修改的标签、注解、名称或命名空间。","[CLOUD-AND-DEPLOYMENT.md:49](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:49)"],["Security-control precedence drift","安全控制配置优先级漂移","Development values, chart defaults, environment variables, command-line flags, feature gates, sidecar injection, or per-region overlays disable authentication, transport security, tenant scoping, or audit policy in a dep…","开发配置、默认值、环境变量、命令行、特性开关、sidecar 或地区 overlay 在部署中关闭安全控制。","[CLOUD-AND-DEPLOYMENT.md:54](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:54)"],["Secret exposure across workload boundaries","跨工作负载边界的秘密暴露","Secrets enter logs, crash reports, process arguments, shared environment, broad volumes, build outputs, service discovery, or read APIs accessible to another workload or tenant.","秘密进入其他工作负载或租户可访问的日志、崩溃信息、参数、共享环境、挂载、产物或 API。","[CLOUD-AND-DEPLOYMENT.md:57](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:57)"],["Credential renewal and outage fallback","凭据续期与故障回退缺陷","Failure to mount, refresh, rotate, or revoke a workload credential causes stale credentials to remain active or an app to accept a less trusted identity mode.","挂载、刷新、轮换或撤销失败导致旧凭据持续有效，或应用回退到低信任身份模式。","[CLOUD-AND-DEPLOYMENT.md:60](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:60)"],["Object and signed-URL policy confusion","对象与签名 URL 策略混淆","Bucket/container policy, object keys, CDN origins, or signed URLs fail to bind principal, operation, object namespace, audience, or expiry.","存储策略、对象键、CDN 来源或签名 URL 未绑定主体、操作、对象范围、受众或有效期。","[CLOUD-AND-DEPLOYMENT.md:65](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:65)"],["Event-source identity confusion","事件源身份混淆","A function or worker trusts event body fields as source identity without validating provider-signed envelope, subscription/topic, account, region, and replay state.","函数信任事件正文自报身份，却未验证提供方签名信封、订阅、账户、地区和重放状态。","[CLOUD-AND-DEPLOYMENT.md:68](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:68)"],["Edge/runtime boundary mismatch","边缘运行时边界不一致","An edge or serverless runtime assumes a secret, API, filesystem, isolation, or tenant policy that differs from the origin runtime, and fallback to origin changes authority or cache behavior.","边缘/无服务器环境与源站的秘密、API、文件系统、隔离或租户策略不同，回退改变权限或缓存行为。","[CLOUD-AND-DEPLOYMENT.md:71](/Users/daitongmin/.codex/skills/security-audit/CLOUD-AND-DEPLOYMENT.md:71)"]]},{"id":"t56","section":"B.8 PROTOCOLS-RPC-AND-MESSAGING.md","line":1016,"header":["公共提示块","原文位置"],"rows":[["`PROTOCOLS-RPC-AND-MESSAGING.md#Core discipline`","[PROTOCOLS-RPC-AND-MESSAGING.md:9](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:9)"],["`PROTOCOLS-RPC-AND-MESSAGING.md#Universal moves`","[PROTOCOLS-RPC-AND-MESSAGING.md:69](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:69)"],["`PROTOCOLS-RPC-AND-MESSAGING.md#Validation rules`","[PROTOCOLS-RPC-AND-MESSAGING.md:75](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:75)"]]},{"id":"t57","section":"B.8 PROTOCOLS-RPC-AND-MESSAGING.md","line":1022,"header":["类别原名","类别中文说明","原文意图片段","意图片段中文说明","原文位置"],"rows":[["Message boundary and canonicalization disagreement","消息边界与规范化解释不一致","Components disagree on length, compression, duplicate fields, unknown fields, encoding, numeric width, normalization, or envelope/body precedence.","组件对长度、压缩、重复/未知字段、编码、位宽、规范化或信封正文优先级有不同解释。","[PROTOCOLS-RPC-AND-MESSAGING.md:21](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:21)"],["Union, enum, and default confusion","联合体、枚举与默认值混淆","Unknown variants, missing discriminators, zero values, default privileges, or compatibility mappings reach code that assumes a validated case.","未知变体、缺少判别值、零值、默认权限或兼容映射进入假定输入已验证的代码。","[PROTOCOLS-RPC-AND-MESSAGING.md:24](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:24)"],["Envelope and payload identity mismatch","信封与消息体身份不一致","Authorization uses trusted-looking routing or envelope metadata while the handler acts on a conflicting tenant, account, subject, object, or sender in the body.","授权依据路由/信封元数据，但处理器按消息体中冲突的租户、账户、对象或发送者执行。","[PROTOCOLS-RPC-AND-MESSAGING.md:27](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:27)"],["Interceptor and method-path inconsistency","拦截器与方法路径不一致","An authn/authz interceptor applies to unary methods but not streams, reflection, health, gateway-transcoded paths, compatibility services, or individual stream messages.","身份/权限拦截器覆盖一元方法，却遗漏流、反射、健康接口、网关转换、兼容路径或单条消息。","[PROTOCOLS-RPC-AND-MESSAGING.md:32](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:32)"],["Peer identity to application-principal confusion","对端身份与应用主体混淆","mTLS, workload identity, bearer metadata, forwarded identity, or broker credentials authenticate a channel, but a caller-controlled field selects the user or tenant.","通道经 mTLS、workload 或 bearer 认证，但调用者可通过字段选择另一个用户/租户。","[PROTOCOLS-RPC-AND-MESSAGING.md:35](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:35)"],["Per-item and streaming authorization gaps","逐项与流式授权缺口","A stream, subscription, batch, or bulk message is authorized once, then later items name different resources or continue after role, membership, or token revocation.","流、订阅或批量请求只授权一次，后续项目切换资源，或在身份权限撤销后继续执行。","[PROTOCOLS-RPC-AND-MESSAGING.md:38](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:38)"],["Callback and reply-correlation confusion","回调与响应关联混淆","Predictable, reused, or cross-tenant correlation IDs let a response, webhook, cancellation, or acknowledgment satisfy another caller's pending operation.","可预测、复用或跨租户的关联 ID 让一方响应、取消或确认满足另一方的待处理操作。","[PROTOCOLS-RPC-AND-MESSAGING.md:41](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:41)"],["Topic, routing-key, and subscription scope gaps","主题、路由键与订阅范围缺口","A publisher or subscriber can select another tenant's topic, wildcard, consumer group, partition, reply queue, or dead-letter route.","发布者或订阅者可选择其他租户主题、通配范围、消费组、分区、回复队列或死信路由。","[PROTOCOLS-RPC-AND-MESSAGING.md:46](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:46)"],["Dead-letter, retry, and diagnostic disclosure","死信、重试与诊断信息泄露","Messages routed to dead-letter queues, error topics, tracing, or operator views contain secrets or cross-tenant payloads accessible to a lower-trust consumer.","失败消息进入低信任消费者可访问的死信队列、错误主题、追踪或运营视图，暴露秘密或跨租户内容。","[PROTOCOLS-RPC-AND-MESSAGING.md:49](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:49)"],["Untrusted producer treated as control plane","将不可信生产者当作控制面","A message body can declare itself an admin event, provider callback, replication record, or migration instruction without an independently authenticated producer and event type.","未独立验证生产者和事件类型，就接受正文自称管理事件、提供方回调、复制记录或迁移指令。","[PROTOCOLS-RPC-AND-MESSAGING.md:52](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:52)"],["Duplicate delivery and idempotency gaps","重复投递与幂等控制缺口","Retries or redelivery repeat a side effect because deduplication is absent, occurs after mutation, or uses a key that collides across tenants or operations.","重试/重投导致重复副作用，因为去重缺失、晚于修改，或去重键跨租户/操作碰撞。","[PROTOCOLS-RPC-AND-MESSAGING.md:57](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:57)"],["Out-of-order and stale message acceptance","乱序与过期消息接受","Older state, revoked membership, canceled work, or pre-step-up authorization arrives after newer state and overwrites it.","旧状态、被撤销权限、已取消工作或旧授权迟到并覆盖新的状态。","[PROTOCOLS-RPC-AND-MESSAGING.md:60](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:60)"],["Acknowledgment/commit ordering defects","确认与提交顺序缺陷","Acknowledgment occurs before durable commit and loses security-relevant work, or commit happens before an unreliable acknowledgment and duplicates a mutation.","提前确认丢失尚未持久化的工作，或先提交后确认失败导致修改重复。","[PROTOCOLS-RPC-AND-MESSAGING.md:63](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:63)"],["Partial multi-consumer transitions","多消费者部分状态转换","Several consumers jointly implement one authorization or business transition, but retries and partial failure leave only a subset committed.","多个消费者共同完成一项安全/业务转换，重试与部分失败使只有部分状态提交。","[PROTOCOLS-RPC-AND-MESSAGING.md:66](/Users/daitongmin/.codex/skills/security-audit/PROTOCOLS-RPC-AND-MESSAGING.md:66)"]]},{"id":"t58","section":"B.9 RESOURCE-EXHAUSTION-AND-AVAILABILITY.md","line":1041,"header":["公共提示块","原文位置"],"rows":[["`RESOURCE-EXHAUSTION-AND-AVAILABILITY.md#Core discipline`","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:9](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:9)"],["`RESOURCE-EXHAUSTION-AND-AVAILABILITY.md#Universal moves`","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:66](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:66)"],["`RESOURCE-EXHAUSTION-AND-AVAILABILITY.md#Validation rules`","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:72](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:72)"]]},{"id":"t59","section":"B.9 RESOURCE-EXHAUSTION-AND-AVAILABILITY.md","line":1047,"header":["类别原名","类别中文说明","原文意图片段","意图片段中文说明","原文位置"],"rows":[["Superlinear parsing, matching, or evaluation","超线性解析、匹配或求值","Small accepted input drives catastrophic regex backtracking, nested parsing, recursive validation, symbolic evaluation, graph traversal, template expansion, or adversarial sort/hash behavior.","小规模有效输入引发正则回溯、嵌套解析、递归验证、求值、图遍历、模板展开或排序/哈希的过量计算。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:21](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:21)"],["Decompression and representation amplification","解压与表示放大","Compressed, sparse, nested, aliased, or encoded input expands far beyond the checked transfer or file size.","压缩、稀疏、嵌套、别名或编码输入展开后远大于已检查的传输/文件大小。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:24](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:24)"],["Database and downstream query amplification","数据库与下游查询放大","A small request creates broad scans, pathological joins, fan-out, unbounded sort/aggregation, or many downstream calls because query depth, filter cardinality, pagination, or expansion fields are not bounded.","查询深度、数量、分页或展开未受限，使小请求触发全局扫描、复杂连接、扇出、聚合或大量下游调用。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:27](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:27)"],["Unbounded buffering and cardinality","无界缓冲与集合规模","Bodies, out-of-order streams, uploads, sessions, unique cache keys, metrics labels, log fields, subscriptions, or pending jobs accumulate without per-item and aggregate limits.","消息体、乱序流、上传、会话、缓存键、标签、订阅或任务在缺少单项和总量限制时持续累积。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:32](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:32)"],["File descriptor, handle, and temporary-resource leaks","文件描述符、句柄与临时资源泄漏","Malformed or canceled work misses cleanup and retains sockets, files, database cursors, timers, subprocesses, temporary files, or object references.","畸形或取消的工作遗漏清理，保留连接、文件、游标、定时器、进程、临时文件或对象引用。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:35](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:35)"],["Detached work after cancellation","取消后仍运行的脱离工作","Client timeout, disconnect, canceled job, or failed authorization returns control but leaves database, model, network, or worker work running.","超时、断连、取消或授权失败已返回，但数据库、模型、网络或 worker 工作继续运行。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:38](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:38)"],["Pre-authentication work imbalance","认证前的计算负担失衡","Expensive parsing, key lookup, cryptography, decompression, or external requests happen before authentication and the earliest size/rate gate.","在认证和最早大小/速率限制前进行昂贵解析、密钥查询、密码学、解压或外部请求。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:43](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:43)"],["Quota-accounting scope and reset gaps","配额核算范围与重置缺口","Accounting uses attacker-influenceable IP, route, tenant, key prefix, task ID, or other dimension, allowing one principal's work to escape its intended budget or consume another principal's allocation.","计费维度受攻击者影响，让工作逃避自身预算或消耗其他主体的配额。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:46](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:46)"],["Worker, pool, and priority starvation","worker、资源池与优先级饥饿","Low-priority or attacker-controlled jobs hold shared locks, workers, database pools, event-loop turns, or scheduler priority needed by unrelated users.","低优先级或可控任务持续占据共享锁、worker、数据库池、事件循环或调度资源，阻碍其他用户。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:49](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:49)"],["Reachable fatal error or deadlock","可达的致命错误或死锁","An untrusted input reaches `panic`, abort, fatal assertion, unhandled exception, process exit, lock cycle, or infinite loop in a shared process.","不可信输入进入共享进程的 panic、abort、致命断言、未处理异常、退出、锁环或无限循环。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:54](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:54)"],["Retry storm and fail-open amplification","重试风暴与故障放行导致的放大","Timeouts, dependency errors, partially processed messages, or health-check failures trigger synchronized or unbounded retries without jitter, ceilings, circuit breaking, or deduplication.","超时或依赖错误引发同步或无界重试，缺少随机延迟、上限、熔断或去重。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:57](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:57)"],["Poison-record and head-of-line blocking","毒化记录与队头阻塞","One malformed record or message repeatedly fails at the front of a shared queue, partition, startup scan, migration, or recovery loop.","一条畸形记录反复在共享队列、分区、启动扫描、迁移或恢复流程前端失败，阻碍后续工作。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:60](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:60)"],["Unsafe recovery and capacity rollback","不安全恢复与容量约束回退","A restart, restore, fallback, or cleanup path rebuilds unbounded state, ignores current quotas, or restores the input that immediately repeats failure.","重启、恢复、回退或清理重新建立无界状态、忽略现有配额，或恢复立即再次触发故障的输入。","[RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:63](/Users/daitongmin/.codex/skills/security-audit/RESOURCE-EXHAUSTION-AND-AVAILABILITY.md:63)"]]},{"id":"t60","section":"B.10 DATA-ISOLATION-AND-LIFECYCLE.md","line":1065,"header":["公共提示块","原文位置"],"rows":[["`DATA-ISOLATION-AND-LIFECYCLE.md#Core discipline`","[DATA-ISOLATION-AND-LIFECYCLE.md:9](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:9)"],["`DATA-ISOLATION-AND-LIFECYCLE.md#Universal moves`","[DATA-ISOLATION-AND-LIFECYCLE.md:72](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:72)"],["`DATA-ISOLATION-AND-LIFECYCLE.md#Validation rules`","[DATA-ISOLATION-AND-LIFECYCLE.md:78](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:78)"]]},{"id":"t61","section":"B.10 DATA-ISOLATION-AND-LIFECYCLE.md","line":1071,"header":["类别原名","类别中文说明","原文意图片段","意图片段中文说明","原文位置"],"rows":[["Missing tenant or owner enforcement","缺少租户或所有者约束","A read, update, delete, list, count, or bulk query identifies an object without binding it to the authenticated tenant/owner, or trusts body fields to supply that identity.","查询通过对象 ID 操作记录，却未绑定认证租户/所有者，或信任正文自报身份。","[DATA-ISOLATION-AND-LIFECYCLE.md:21](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:21)"],["Composite-key and namespace collision","复合键与命名空间碰撞","Cache keys, object paths, database uniqueness, search document IDs, temporary files, or deduplication keys omit tenant or environment.","缓存键、对象路径、唯一约束、索引 ID、临时文件或去重键漏掉租户/环境维度。","[DATA-ISOLATION-AND-LIFECYCLE.md:24](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:24)"],["Policy and query disagreement","策略与查询不一致","Row-level policy, ORM default scopes, authorization filters, and raw/bypass clients apply different predicates.","行级策略、ORM 默认范围、授权过滤器与原始/绕过客户端使用不同条件。","[DATA-ISOLATION-AND-LIFECYCLE.md:27](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:27)"],["Blob and signed-reference overreach","对象数据与签名引用权限越界","Object keys, attachment IDs, version IDs, shared links, or signed URLs permit operations or namespaces beyond the issuing principal's access, or remain valid after the underlying ACL changes.","对象键、附件/版本 ID、共享链接或签名 URL 超出签发主体权限，或底层 ACL 改变后仍有效。","[DATA-ISOLATION-AND-LIFECYCLE.md:30](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:30)"],["Search, cache, and index ACL drift","搜索、缓存与索引 ACL 漂移","A primary record's ACL or lifecycle changes without invalidating a searchable, cached, embedded, thumbnail, RSS, preview, or index copy.","主记录的 ACL/生命周期改变后，没有使搜索、缓存、向量、缩略图、预览或索引副本同步失效。","[DATA-ISOLATION-AND-LIFECYCLE.md:35](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:35)"],["Analytics, logs, traces, and diagnostics as alternate readers","分析、日志、追踪与诊断成为替代读取通道","Private content or credentials are emitted into systems with broader access, longer retention, or tenant mixing.","私有内容或凭据进入权限更宽、保留更久或混合租户的数据系统。","[DATA-ISOLATION-AND-LIFECYCLE.md:38](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:38)"],["Enumeration and aggregate oracles","枚举与聚合结果探测","Counts, filters, ordering, errors, unique constraints, timings, notification behavior, or existence checks disclose protected object or account state.","计数、筛选、排序、错误、唯一约束、时序、通知或存在检查暴露受保护对象/账户状态。","[DATA-ISOLATION-AND-LIFECYCLE.md:41](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:41)"],["Export and backup scope expansion","导出与备份范围扩大","An export, snapshot, portability package, report, or backup includes other tenants, inaccessible object fields, soft-deleted data, secret values, or history above the requester's access.","导出、快照、报告或备份包含请求者无权访问的租户、字段、已删除数据、秘密或历史。","[DATA-ISOLATION-AND-LIFECYCLE.md:46](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:46)"],["Import and restore authority expansion","导入与恢复权限扩大","Restore/import bypasses owner, schema, ACL, uniqueness, or validation rules, overwrites existing resources, or recreates records in a tenant the requester cannot write.","导入/恢复绕过 owner、schema、ACL、唯一性或校验，覆盖资源或在无写权限租户创建数据。","[DATA-ISOLATION-AND-LIFECYCLE.md:49](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:49)"],["Migration default and ownership confusion","迁移默认值与所有权混淆","Old records lack tenant/ACL/lifecycle fields, incompatible IDs collide, or partial rollout makes new and old readers apply different defaults.","旧记录缺少租户/ACL/生命周期字段，或 ID 冲突及部分部署使新旧读取器采用不同默认值。","[DATA-ISOLATION-AND-LIFECYCLE.md:52](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:52)"],["Backup and replication boundary drift","备份与复制边界漂移","Encryption keys, storage accounts, cross-region replicas, restoration environments, or support snapshots have broader identity or tenant scope than primary data.","备份、副本、密钥、恢复环境或支持快照拥有比主数据更宽的身份/租户访问范围。","[DATA-ISOLATION-AND-LIFECYCLE.md:55](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:55)"],["Soft-delete and tombstone bypass","软删除与墓碑标记绕过","Direct lookup, search, relation traversal, object link, background processor, or restore ignores the lifecycle predicate and returns or acts on a deleted/revoked record.","替代读取、链接、后台处理或恢复忽略删除/撤销条件，继续返回或操作相关记录。","[DATA-ISOLATION-AND-LIFECYCLE.md:60](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:60)"],["Stale authorization and derived copy use","过期授权与衍生副本使用","Membership removal, ACL update, consent withdrawal, secret revocation, or role downgrade does not invalidate sessions, caches, subscriptions, jobs, or materialized data that continue to authorize future operations.","成员、ACL、同意、秘密或角色撤销后，会话、缓存、订阅、任务或物化数据仍授权后续操作。","[DATA-ISOLATION-AND-LIFECYCLE.md:63](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:63)"],["Retention and queued-work overrun","保留期限与排队工作超出约定","Deletion completes in primary storage while queued processors, retries, exports, analytics, or generated artifacts recreate or retain the data beyond the promised boundary.","主存储已删除数据，但排队、重试、导出、分析或生成产物重新创建或继续保留它。","[DATA-ISOLATION-AND-LIFECYCLE.md:66](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:66)"],["Restore reintroduces invalid state","恢复重新引入无效状态","Backup, undo, undelete, or replica recovery restores data, credentials, memberships, or permissions that current policy no longer allows.","备份恢复、撤销删除或副本恢复带回当前策略不再允许的数据、凭据、成员或权限。","[DATA-ISOLATION-AND-LIFECYCLE.md:69](/Users/daitongmin/.codex/skills/security-audit/DATA-ISOLATION-AND-LIFECYCLE.md:69)"]]},{"id":"t62","section":"B.11 DESKTOP-MOBILE-AND-LOCAL-IPC.md","line":1091,"header":["公共提示块","原文位置"],"rows":[["`DESKTOP-MOBILE-AND-LOCAL-IPC.md#Core discipline`","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:9](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:9)"],["`DESKTOP-MOBILE-AND-LOCAL-IPC.md#Universal moves`","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:77](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:77)"],["`DESKTOP-MOBILE-AND-LOCAL-IPC.md#Validation rules`","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:83](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:83)"]]},{"id":"t63","section":"B.11 DESKTOP-MOBILE-AND-LOCAL-IPC.md","line":1097,"header":["类别原名","类别中文说明","原文意图片段","意图片段中文说明","原文位置"],"rows":[["Custom-scheme and deep-link ambiguity","自定义 URI 协议与深链接歧义","Another app or page can invoke a route that mutates state, imports data, completes authentication, or selects an account without a current-session and one-time callback binding.","其他应用/页面在缺少当前会话及一次回调绑定时，通过路由修改状态、导入、完成认证或选择账户。","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:21](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:21)"],["App and account handoff confusion","应用与账户交接混淆","OAuth, SSO, magic-link, invite, device pairing, passwordless, or payment callbacks return to the wrong installed app, profile, tenant, or pending transaction.","登录、邀请、配对或支付回调进入错误的应用、profile、租户或待处理事务。","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:24](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:24)"],["File-open and intent authority confusion","文件打开与 Intent 权限混淆","An associated file, share intent, drag/drop item, pasteboard/clipboard record, notification action, or open-file event triggers a privileged operation without confirming content type, sender trust where applicable, curre…","文件关联、共享 Intent、拖放、剪贴板、通知或打开事件在未充分校验类型、来源及用户意图时触发特权操作。","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:27](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:27)"],["Navigation-origin to bridge confusion","导航来源与原生桥接混淆","Remote or attacker-controlled frames can reach a JavaScript/native bridge intended only for packaged content.","远程或可控 frame 能访问原本仅面向应用打包内容的 JavaScript/原生桥。","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:32](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:32)"],["Over-broad native bridge capabilities","原生桥接能力过宽","Web content can select arbitrary files, commands, IPC methods, credentials, or system actions through a generic bridge.","网页通过通用 bridge 选择任意文件、命令、IPC 方法、凭据或系统动作。","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:35](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:35)"],["Webview file and universal access","WebView 文件与跨源通用访问","Remote content can read app-local files, privileged custom schemes, or internal origins because file access, universal access, mixed content, debug interfaces, or custom protocol handlers join origins unexpectedly.","文件访问、通用访问、混合内容、调试或自定义协议意外连接不同来源，使远程内容读取本地受保护数据。","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:38](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:38)"],["IPC peer-authentication gaps","IPC 对端认证缺口","Unix sockets, named pipes, XPC, Binder, D-Bus, native messaging, RPC, shared memory, or loopback listeners accept a lower-trust peer without checking OS credentials, code identity, sandbox token, or channel ownership.","本地 IPC 或 loopback 接口未验证 OS 凭据、代码身份、sandbox token 或通道归属就接受低信任对端。","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:43](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:43)"],["Claimed principal versus channel identity","自报主体与通道身份不一致","The authenticated process/channel belongs to one app or user, but request fields select another user, tenant, profile, or capability.","已认证的进程/通道属于一个应用或用户，但请求字段指定另一个用户、租户、profile 或能力。","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:46](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:46)"],["Exported service, activity, receiver, or provider overreach","导出组件权限越界","A mobile component or local automation endpoint is externally invokable and performs an operation intended for the app itself.","移动组件或本地自动化接口被外部调用，执行原本只允许应用自身执行的操作。","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:49](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:49)"],["IPC lifecycle and correlation confusion","IPC 生命周期与请求关联混淆","Predictable request IDs, reused handles, stale channels, inherited descriptors, world-writable socket paths, or restart behavior lets one peer answer, cancel, or reuse another peer's operation.","请求 ID、句柄、旧通道、继承描述符、可写 socket 路径或重启让一个对端响应、取消或复用另一方操作。","[DESKTOP-MOBILE-AND-LOCAL-IPC.md:52](/Users/daitongmin/.codex/skills/security-audit/DESKTOP-MOBILE-AND-LOCAL-IPC.md:52)"],["Privileged helper as confused deputy","特权辅助程序成为混淆代理","A low-privilege caller can select a privileged command, file, service, user, or system setting without per-operation authorization.","低权限调用者在缺少逐操作授权时选择特权命令、文件、服务、用户或系统设置。","[ tion":"映射低信任主体、正常能力、对象权限、租户和控制","output":"事实返回 N","condition":"不推断线上可达性","source":"S2:22"},{"id":"P1.4","title":"路径侦察","stage":1,"owner":"Recon 1c","input":"输入和处理源码","action":"列入口、转换、副本、sink、并行路径及限制","output":"事实返回 N","condition":"不发送测试输入","source":"S2:35"},{"id":"P1.5","title":"验证条件侦察","stage":1,"owner":"Recon 1d","input":"测试/配置/沙箱能力","action":"找最小离线检查、部署未知、禁止命令、可执行条件","output":"事实返回 N","condition":"缺少沙箱/晋升能力要保留阻塞原因","source":"S2:44"},{"id":"P1.6","title":"补充侦察","stage":1,"owner":"聚焦 Recon","input":"未映射模式/子系统","action":"按实质差异补足事实","output":"事实或 `deferred` 单元","condition":"必须先重新检查预算","source":"S2"},{"id":"P1.7","title":"架构综合","stage":1,"owner":"Parent","input":"四类事实、历史缺口","action":"写约 1,000 words 上限的架构摘要","output":"`architecture.md`","condition":"子 Agent 不是该文件写入者","source":"S2:73"},{"id":"P1.8","title":"方法选择","stage":1,"owner":"Parent","input":"真实边界 + 攻击文件","action":"选普通类、专项类，记录选中块和排除理由","output":"`ordinary_attack_class_block`、`selected_companion_blocks`、`excluded_blocks`","condition":"不能只因某种语言出现就选专项","source":"S2、S8"},{"id":"P1.9","title":"建覆盖单元","stage":1,"owner":"Parent","input":"入口×边界×子系统×类别；deep 可加生命周期","action":"编码稳定 ID、排序、建立计划","output":"`coverage-ledger.json`","condition":"这是任务空间，不是具体漏洞全集","source":"S2:90"},{"id":"P1.10","title":"校验账本","stage":1,"owner":"Parent/脚本","input":"初始账本","action":"运行 ledger validator，修正全部错误","output":"PASS/FAIL、退出码 O","condition":"不合法账本不能驱动任务","source":"S2、S6"},{"id":"P2.1","title":"预算与优先级","stage":2,"owner":"Parent","input":"单元、历史证据、剩余预算","action":"优先低信任入口、高价值资源、历史缺口和变化源码等","output":"排序理由 N、被延后单元","condition":"保留 critic 与验证预算","source":"S3:3"},{"id":"P2.2","title":"组装任务","stage":2,"owner":"Parent","input":"架构、单元、方法块、schema","action":"按规定顺序组装完整 Hunter 提示词","output":"实际 prompt O；`in_progress`、`agent_id`","condition":"必须复制选中块正文，不能只发类名","source":"S3:11"},{"id":"P2.3","title":"形成/检查假设","stage":2,"owner":"Hunter","input":"入口、能力、控制与路径","action":"从具体安全不变量出发深读代码，寻找失败条件及反例","output":"`invariant`、候选根因/路径等","condition":"初始和放弃假设没有统一历史字段","source":"S3:27"},{"id":"P2.4","title":"选择分析路径","stage":2,"owner":"Hunter","input":"假设、已有证据","action":"追踪 identity/authz/normalization/state/copies/sink；比较并行路径","output":"`checks`、`reviewed_paths`、`trace`、`evidence`","condition":"调查深度限定在负责边界及依赖保证内","source":"S3"},{"id":"P2.5","title":"最小本地检查（条件）","stage":2,"owner":"Hunter","input":"可执行条件、假数据","action":"需要观察行为且隔离可执行时选择最窄测试；记录命令、输入、限制、最小实际结果","output":"`execution` 或阻塞；scratch 证据","condition":"非每条假设必执行；源码可反驳时停止，需本地证据却无法执行时保留精确阻塞","source":"S1、S3"},{"id":"P2.6","title":"晋升证据（条件）","stage":2,"owner":"可信父端代码","input":"预声明 scratch 文件、目录描述符","action":"需保留本地文件时，在子进程全部结束后逐文件安全读取、复制到 artifacts","output":"`artifact` 路径；晋升结果 O/N","condition":"source check 不晋升；Agent 不能自行写 artifacts；失败证据不可引用","source":"S1、S3"},{"id":"P2.7","title":"候选门","stage":2,"owner":"Hunter","input":"路径、最强防护、检查结果","action":"排除单纯硬化、自我影响、已被源码反驳的推测","output":"`proposed_verdict`；空 `candidates` 也合法","condition":"暂定 confirmed 还不是最终 confirmed","source":"S3:138"},{"id":"P2.8","title":"返回","stage":2,"owner":"Hunter","input":"各单元调查结果","action":"返回且只返回一个 JSON","output":"`units`、`candidates`、`hardening`、`uncovered`","condition":"每个分配 ID 必须出现一次","source":"S3:168"},{"id":"P2.9","title":"父端接收","stage":2,"owner":"Parent","input":"原始 Hunter 返回","action":"检查 ID、归属、证据、结构；逐单元更新账本","output":"`checks`→`local_checks`，指纹/未知等","condition":"失败/畸形/不支持的结论不算完成，重新计划","source":"S3:215"},{"id":"P2.10","title":"候选合并","stage":2,"owner":"Parent","input":"多 Hunter 候选","action":"先按 fingerprint 再按根因去重","output":"合并候选；账本关联","condition":"独立缺失控制仍需独立指纹","source":"S3"},{"id":"P2.11","title":"波后 critic","stage":2,"owner":"新 critic","input":"全账本、架构、候选、历史","action":"找缺失单元、弱检查、无根据关闭和排除","output":"critic JSON","condition":"critic 不负责输出漏洞裁决","source":"S3:221"},{"id":"P2.12","title":"接受/重派","stage":2,"owner":"Parent","input":"critic 建议","action":"检查范围、派生规范 ID；归档旧 attempts；新 owner 重查","output":"`attempts`、`wave`、新增单元","condition":"不把旧 owner 的证据复制到新 live attempt","source":"S2、S3"},{"id":"P2.13","title":"最终覆盖复查","stage":2,"owner":"新 final-clean critic","input":"波后无接受工作且无 planned 的状态","action":"standard/deep 再做独立 clean pass","output":"critic JSON","condition":"有新工作则继续；quick 无该额外 pass","source":"S3"},{"id":"P3.1","title":"独立候选验证","stage":3,"owner":"新 general verifier","input":"每个唯一候选/继承候选","action":"重读全部引用、重构最强控制、尝试反驳；安全可行时复现","output":"`decision` + schema `record`","condition":"不接收另一个 verifier 的结论","source":"S4:3"},{"id":"P3.2","title":"接收裁决","stage":3,"owner":"Parent","input":"verifier 原始 JSON","action":"核对指纹、合并修正、登记每个关联单元","output":"三种 verdict、检查归属","condition":"畸形返回直接丢弃并用新 verifier 重试，不手工修成有效裁决","source":"S4"},{"id":"P4.1","title":"写最终记录","stage":4,"owner":"Parent","input":"已独立决定的记录","action":"按 fingerprint 排序写三种裁决","output":"`findings.json`","condition":"尚未验证的候选不得塞入任意 verdict","source":"S4:95"},{"id":"P4.2","title":"两个校验器","stage":4,"owner":"Parent/脚本","input":"findings/ledger","action":"各自检查结构和有限语义约束","output":"PASS/FAIL、错误、退出码","condition":"不证明漏洞真实性，不自动验证两文件外键","source":"S6、S7"},{"id":"P5.1","title":"最终记录复核","stage":5,"owner":"新 research verifier","input":"confirmed/needs_validation 结构记录","action":"检查 source、接口、条件、影响、风险、修复或阻塞计划","output":"`verified` 或 `replace`","condition":"quick 合并在 P3；其他 profile 独立","source":"S4:120"},{"id":"P5.2","title":"替换门","stage":5,"owner":"Parent","input":"replace 记录和理由","action":"区分文字微调与根因/路径/输入/结果/影响/严重性等重大变化","output":"替换前后记录","condition":"重大变化必须由又一个独立 verifier 复查","source":"S4"},{"id":"P5.3","title":"循环/不完整","stage":5,"owner":"新 verifier/Parent","input":"重大替换","action":"再验证；必要时继续替换与独立复核","output":"verified 或新 replace","condition":"预算或独立性不足，移除争议发现，保留 unresolved candidate，标记 incomplete","source":"S4"},{"id":"P5.4","title":"再次校验","stage":5,"owner":"Parent/脚本","input":"已应用替换","action":"更新关联决定并重跑两个校验器","output":"校验事件 O","condition":"每次应用替换都要做，不只是最后做","source":"S4"},{"id":"P6.1","title":"生成总报告","stage":6,"owner":"Parent","input":"最终记录、账本、hardening","action":"写范围、姿态、已确认/待验证、硬化、覆盖限制","output":"`REPORT.md`","condition":"报告不能增强裁决或影响","source":"S4:155"},{"id":"P6.2","title":"详细确认报告","stage":6,"owner":"Parent","input":"medium/high/critical confirmed","action":"复制完整证据和本地重现、修复/回归案例","output":"`FINDINGS-DETAIL.md`","condition":"low/informational 不在明确要求的详细集合中","source":"S4:169"},{"id":"P6.3","title":"待验证报告","stage":6,"owner":"Parent","input":"needs_validation 记录","action":"写精确阻塞、边界和适用检查计划","output":"`NEEDS-VALIDATION.md`","condition":"未独立验证的 ledger candidate 必须单独披露，不伪装成 needs_validation finding","source":"S4:180"},{"id":"P6.4","title":"终止","stage":6,"owner":"Parent","input":"文件、裁决、校验、剩余工作","action":"区分完成与明确不完整","output":"`run_status`；必要时 `incomplete_reason`","condition":"审查完成与全部报告落盘是两个里程碑；按 S1 的全部输出/校验终止条件判断整体完成","source":"S1、S4"}],"sources":{"AI-AND-LLM.md":{"path":"/Users/daitongmin/.codex/skills/security-audit/AI-AND-LLM.md","text":"# AI, LLM, and Agent Hunting\n\n#### When to use this file\n\nReach for this file when a language model participates in a trust-sensitive decision: chatbots and assistants, RAG pipelines, persistent agent memory, agent/tool-calling loops, MCP servers and clients, code that builds prompts from untrusted input, or code that consumes model output and acts on it. The important data flow is *untrusted content → model or memory → capability, authority, or sink*.\n\nUse this alongside `ATTACK-CLASSES.md`, not instead of it. Transport, access control, query construction, filesystem use, and output rendering remain ordinary trust boundaries. This file covers the model-specific delegation layer. Split large targets by retrieval, memory, tool dispatch, MCP, and output handling.\n\n## Core discipline (include in every agent prompt for this domain)\n\n```\n- Prompt injection alone is not a finding. Require a code-level boundary failure: content reaches another principal's context, invokes authority the requester lacks, discloses data they cannot read, or drives a sink they cannot reach directly.\n- Model output, memory, tool descriptions, and MCP responses are untrusted inputs. Point to the code that grants authority, trusts output, writes durable state, or feeds a sink.\n- A guardrail prompt is not a security boundary. Count only deterministic checks, resource-scoped authorization, isolation, binding, and constrained credentials.\n- State the attacker, affected principal, effective execution identity, resource, exact action, authority used, and observable impact. An intentional direct request to use the requester's existing authority is not a delegation defect merely because a model executes it.\n- Authorization and action binding are separate controls. Attacker-controlled content that causes an action under an affected principal's valid authority is an action-binding failure when that principal did not intentionally request or approve the exact action.\n- Classify every candidate as `confirmed` only after source evidence and bounded local validation establish the boundary and result. Use `needs_validation` when a required provider, deployment, model, renderer, or identity behavior is not observable locally.\n```\n\n## Context, retrieval, and memory attack classes (subagent_type: `general`)\n\n**Indirect injection through retrieved or ingested content**\nAn attacker can write a RAG document, indexed page, file, email, issue body, tool response, or metadata that enters a different principal's model context. Trace who can write each source, how retrieval scopes it, whose session consumes it, and what capability is enabled there. Check isolation, resource authorization, and binding to the consuming principal's intent separately. The defect is a missing deterministic control, not persuasive text by itself.\n\n**Cross-session or cross-tenant context bleed**\nConversation history, embeddings, retrieval results, or prompt caches are keyed too broadly. Verify tenant and ACL filters in the query itself and every cache key. A tenant field stored on an object is not enforcement if an alternate query, shared cache, or batch path omits it.\n\n**Persistent memory poisoning**\nAttacker-controlled content or model summaries are written into memory that later shapes another task, user, or privileged session. Review who may create, update, merge, and delete memory; its provenance and tenant scope; whether low-trust observations become durable instructions or facts; and whether retrieval distinguishes user preferences from tool policy. Memory intentionally saved by a user and used only for that user's intentional, allowed requests is not a cross-boundary finding.\n\n**Prompt role and provenance confusion**\nPrompt assembly lets untrusted text impersonate a system message, prior turn, tool result, policy, or memory record. Look for string concatenation, untyped history, caller-controlled role fields, and serialization round trips that lose source labels. Confirm that the forged provenance changes a deterministic trust decision or reaches a meaningful capability.\n\n## Tool and action attack classes (subagent_type: `general`)\n\n**Tool-argument injection into a downstream sink**\nModel-produced arguments reach SQL, shell, file, URL-fetch, or privileged APIs without handler-side validation. Treat the tool schema as input parsing, then follow each field from decoded call to sink. Structured output narrows shape; it does not establish authorization, safe paths, safe URLs, or query semantics.\n\n**Excessive agency and confused-deputy authority**\nThe agent uses a service identity or broad credential, while the tool handler does not re-check the requesting principal's permission on the named resource. Verify both the effective identity and whether the caller could perform that exact operation through the normal product interface. A shared credential with enforced per-user query scope is not a defect.\n\n**Action-confirmation and approval binding**\nA user approves one described action but execution can use changed arguments, a different resource, a different principal, or a later model turn. An action-binding defect also exists when attacker-controlled content causes a side effect under a victim's valid authority without the victim's intentional request or approval, even if generic authorization permits the victim to perform it. Review whether intent or confirmation binds the normalized tool name, complete argument object, requester, target, amount, expiry, and batch membership. Check retries and resumed sessions: an approval must not authorize a mutated or duplicate side effect.\n\n**Tool-schema and dispatcher disagreement**\nThe schema accepts aliases, extra fields, duplicate keys, coercions, nested free-form objects, or out-of-range values that the dispatcher or handler interprets differently. Compare schema validation, canonicalization, generated bindings, and handler defaults. Validate again where values become resource selectors or security-relevant options.\n\n**Unbounded delegated action loops**\nA bounded request can enqueue repeated spend, send, mutation, or external API work without a per-request budget, per-action authorization, cancellation, or idempotency control. Confirm impact on shared cost, quotas, other users, or durable state. Do not test by exhausting a service; use code-level accounting and a locally bounded loop.\n\n## MCP and sub-agent trust classes (subagent_type: `general`)\n\n**Sub-agent and MCP trust inheritance**\nA delegated task receives the full session, credentials, memory, or capabilities rather than the least authority required. Check the principal and tenant carried into each call, capability narrowing, credential audience, and whether delegated results are treated as untrusted on return.\n\n**MCP server and tool identity confusion**\nCalls or results are routed by attacker-influenceable server names, tool names, request IDs, resource URIs, or model-selected aliases rather than the authenticated connection and outstanding request. Check whether two servers can claim the same tool or resource identity, whether reconnect changes the binding, and whether a response from one server can satisfy another server's pending call.\n\n**MCP metadata and schema as policy**\nTool descriptions, resource metadata, prompts, completion hints, or schemas supplied by an MCP peer are trusted as policy or authorization. These fields can guide the model but cannot grant capability. Find the deterministic allowlist, server identity check, and handler authorization that remain authoritative when metadata conflicts.\n\n## Output and disclosure attack classes (subagent_type: `general`)\n\n**Insecure output rendering**\nModel output reaches an executing HTML, Markdown, template, URL, or command sink without the sink's required encoding and policy. For browser rendering, verify auto-loaded resources and CSP or sanitization in `CLIENT-SIDE.md`; renderer behavior outside the repository makes the candidate `needs_validation`.\n\n**Sensitive context extraction**\nThe assembled context contains credentials, another user's data, private source, or policy values that themselves grant access, and user-influenced output exposes them. Read prompt assembly and data-fetch code. Disclosure of generic instructions or behavior that does not cross a data boundary is not a finding.\n\n## Universal moves (apply across the above)\n\n- Draw four maps first: each execution identity, each capability, every writable context or memory source, and each output destination. Then connect the principal at the start to the authority at the end.\n- Start at side-effecting tools and work backward through dispatcher, schema, confirmation, model context, retrieval, and ingestion. Start at durable memory reads and trace every writer.\n- Compare direct, queued, retry, resume, batch, and delegated paths for the same action. The strongest gate must apply after arguments are final and before every side effect.\n\n## Validation rules (apply before reporting ANY finding here)\n\n1. Name the crossed boundary and observable result: attacker, affected principal or shared resource, execution identity, targ
